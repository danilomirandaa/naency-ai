name: Atualizar baselines visuais

# Rodar manualmente (Actions → Atualizar baselines visuais → Run workflow) quando
# a mudança visual é intencional ou quando uma story nova precisa de baseline.
# Gera os screenshots no mesmo container Linux da CI, valida, commita na branch
# escolhida e dispara a CI para confirmar.
on:
  workflow_dispatch:

# Grupo próprio e sem cancelamento: um push na branch não pode interromper a
# geração dos baselines no meio.
concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Gerar, validar e commitar baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write # commitar os PNGs
      actions: write # disparar a CI depois do commit
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build-storybook -- --quiet
      - run: npm run test:visual:update

      - name: Validar baselines gerados
        run: npm run test:visual

      - name: Commitar baselines
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Nenhum baseline mudou."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "test(visual): atualiza baselines Linux"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits feitos com GITHUB_TOKEN não disparam workflows por push, mas
      # workflow_dispatch disparado com o mesmo token dispara.
      - name: Disparar a CI na branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
