name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permite rodar de novo manualmente (e é como o workflow de baselines
  # dispara a validação depois de commitar os screenshots).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todos os jobs usam a imagem oficial do Playwright na MESMA versão do
# @playwright/test do package-lock (1.63.0), para os screenshots serem idênticos
# entre execuções. Ao atualizar o Playwright, atualize as tags `image` abaixo e
# em visual-baselines.yml.
jobs:
  quality:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run typecheck
      - name: Migrations em dia com o schema
        run: |
          # Sem isso o git recusa o repositório no container e o status sai vazio.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm run db:generate
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::O schema mudou sem migration. Rode npm run db:generate e commite."
            git status --porcelain server/db/migrations
            exit 1
          fi
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:storybook
      - run: npm run build

  visual:
    name: Regressão visual
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build-storybook -- --quiet
      - run: npm run test:visual
      - name: Relatório com as diferenças
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
